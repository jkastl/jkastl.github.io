name: Dot Sheets tests

on:
  push:
    branches: [main]
    paths: ['dot-sheets/**', '.github/workflows/dot-sheets-tests.yml']
  pull_request:
    paths: ['dot-sheets/**', '.github/workflows/dot-sheets-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node's built-in test runner; there are no dependencies to install.
      - run: node --test 'dot-sheets/test/*.test.js'
