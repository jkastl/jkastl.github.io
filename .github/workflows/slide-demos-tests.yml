name: Slide demos tests

# Slide Pyramid and Stain Drift, which share shared/tissue.js.
on:
  push:
    branches: [main]
    paths: ['shared/**', 'slide-pyramid/**', 'stain-drift/**', '.github/workflows/slide-demos-tests.yml']
  pull_request:
    paths: ['shared/**', 'slide-pyramid/**', 'stain-drift/**', '.github/workflows/slide-demos-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node's built-in test runner; there are no dependencies to install.
      - run: node --test 'slide-pyramid/test/*.test.js' 'stain-drift/test/*.test.js'
