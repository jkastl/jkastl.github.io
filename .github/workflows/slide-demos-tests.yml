name: Slide demos tests

# Pyramid Scheme and Off Color, which share shared/tissue.js.
on:
  push:
    branches: [main]
    paths: ['shared/**', 'pyramid-scheme/**', 'off-color/**', '.github/workflows/slide-demos-tests.yml']
  pull_request:
    paths: ['shared/**', 'pyramid-scheme/**', 'off-color/**', '.github/workflows/slide-demos-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node's built-in test runner; there are no dependencies to install.
      - run: node --test 'pyramid-scheme/test/*.test.js' 'off-color/test/*.test.js'
