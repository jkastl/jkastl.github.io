name: Tile to Table tests

on:
  push:
    branches: [main]
    paths: ['tile-to-table/**', '.github/workflows/tile-to-table-tests.yml']
  pull_request:
    paths: ['tile-to-table/**', '.github/workflows/tile-to-table-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node's built-in test runner; there are no dependencies to install.
      - run: node --test 'tile-to-table/test/*.test.js'
